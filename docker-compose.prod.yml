# Chạy cả hệ thống bằng image production (không dùng cho dev hằng ngày, dev dùng `pnpm dev`):
#   docker compose -f docker-compose.prod.yml --env-file apps/backend/.env up -d --build
# Mở http://localhost:8088 (đổi cổng bằng APP_PORT). Chỉ frontend (nginx) mở cổng ra ngoài.
name: chat_system_prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_system
      POSTGRES_USER: ${DB_USERNAME:?thiếu DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?thiếu DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d chat_system"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chat_system
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SIGNER_KEY: ${SIGNER_KEY:?thiếu SIGNER_KEY}
      EMAIL_ACCOUNT: ${EMAIL_ACCOUNT:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      # Origin người dùng mở trên trình duyệt (WebSocket allowed-origin và link mời)
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8088}
    volumes:
      - uploads:/app/upload-dir

  frontend:
    build: apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8088}:80"

volumes:
  postgres_data:
  uploads:
