# docker-compose.yml (root)
# Giữ nguyên project name "chat_system" để dùng lại volume dữ liệu cũ
# (chat_system_postgres_data). Đổi tên này = Postgres mới, trống.
name: chat_system

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_system_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_system
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
