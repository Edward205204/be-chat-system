name: chat_system

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_system_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_system
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Chỉ mở cho máy này, không lộ Postgres ra mạng LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
